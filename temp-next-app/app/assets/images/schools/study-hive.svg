<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="500" height="300" viewBox="0 0 500 300">
  <!-- Background -->
  <rect width="500" height="300" fill="#f8f8f8"/>

  <!-- Honeycomb background pattern -->
  <g opacity="0.1">
    <path d="M150,80 L175,120 L150,160 L100,160 L75,120 L100,80 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M200,80 L225,120 L200,160 L150,160 L125,120 L150,80 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M250,80 L275,120 L250,160 L200,160 L175,120 L200,80 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M300,80 L325,120 L300,160 L250,160 L225,120 L250,80 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M350,80 L375,120 L350,160 L300,160 L275,120 L300,80 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M400,80 L425,120 L400,160 L350,160 L325,120 L350,80 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>

    <path d="M125,160 L150,200 L125,240 L75,240 L50,200 L75,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M175,160 L200,200 L175,240 L125,240 L100,200 L125,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M225,160 L250,200 L225,240 L175,240 L150,200 L175,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M275,160 L300,200 L275,240 L225,240 L200,200 L225,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M325,160 L350,200 L325,240 L275,240 L250,200 L275,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M375,160 L400,200 L375,240 L325,240 L300,200 L325,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
    <path d="M425,160 L450,200 L425,240 L375,240 L350,200 L375,160 Z" fill="#FFD700" stroke="#333333" stroke-width="1"/>
  </g>

  <!-- Central hexagonal logo -->
  <g transform="translate(250,150) scale(1.5)">
    <!-- Main hexagon -->
    <path d="M0,-40 L34.64,20 L-34.64,20 Z" fill="#FFD700" stroke="#333333" stroke-width="2"/>
    <path d="M0,-40 L34.64,-20 L34.64,20 Z" fill="#FFDC35" stroke="#333333" stroke-width="2"/>
    <path d="M-34.64,-20 L0,-40 L-34.64,20 Z" fill="#E5C100" stroke="#333333" stroke-width="2"/>
    <path d="M-34.64,20 L0,40 L34.64,20 Z" fill="#FFE55C" stroke="#333333" stroke-width="2"/>
    <path d="M-34.64,-20 L-34.64,20 L0,40 Z" fill="#F0CD15" stroke="#333333" stroke-width="2"/>
    <path d="M34.64,-20 L34.64,20 L0,40 Z" fill="#FFE980" stroke="#333333" stroke-width="2"/>

    <!-- Inner design - honeycomb structure -->
    <path d="M0,-20 L17.32,0 L0,20 L-17.32,0 Z" fill="#F5F5F5" stroke="#333333" stroke-width="1"/>
    <circle cx="0" cy="0" r="8" fill="#333333"/>

    <!-- Small bee symbol -->
    <circle cx="25" cy="10" r="5" fill="#333333"/>
    <circle cx="25" cy="0" r="5" fill="#333333"/>
    <path d="M25,15 C30,25 20,25 25,15" fill="#FFD700"/>
  </g>

  <!-- Text for "The Study Hive" -->
  <text x="250" y="240"
        font-family="'Poppins', sans-serif"
        font-size="24"
        font-weight="bold"
        text-anchor="middle"
        fill="#333333">THE STUDY HIVE</text>

  <!-- Tagline -->
  <text x="250" y="270"
        font-family="'Poppins', sans-serif"
        font-size="14"
        font-style="italic"
        text-anchor="middle"
        fill="#666666">Excellence in Science Education</text>
</svg>